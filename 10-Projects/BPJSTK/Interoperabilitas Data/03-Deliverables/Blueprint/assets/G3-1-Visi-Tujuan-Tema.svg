<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="530" fill="#ffffff"/>
  <g id="visi-korporat">
    <rect x="40" y="20" width="920" height="62" rx="10" fill="#eef3f8" stroke="#0b5394"/>
    <text x="500" y="44" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b5394">Visi BPJS Ketenagakerjaan</text>
    <text x="500" y="68" text-anchor="middle" font-size="14" font-style="italic" fill="#333">Mewujudkan jaminan sosial ketenagakerjaan yang terpercaya, berkelanjutan dan menyejahterakan seluruh pekerja Indonesia</text>
  </g>
  <g id="panah-visi" stroke="#666" stroke-width="2" fill="none"><path d="M500 82 L500 110"/></g>
  <g id="isi" transform="translate(0,90)">
  <g id="visi">
    <rect x="40" y="24" width="920" height="74" rx="10" fill="#0b5394"/>
    <text x="500" y="54" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">Visi Data</text>
    <text x="500" y="80" text-anchor="middle" font-size="15" fill="#ffffff">ESDP sebagai titik pusat integrasi data yang tepercaya, aman, dan siap dipakai</text>
  </g>
  <g id="tujuan" font-size="14">
    <text x="40" y="132" font-size="15" font-weight="bold" fill="#333">Tujuan transformasi</text>
    <rect x="40" y="144" width="170" height="96" rx="8" fill="#cfe2f3" stroke="#0b5394"/>
    <text x="125" y="184" text-anchor="middle">Data punya</text><text x="125" y="202" text-anchor="middle">pemilik dan aturan</text>
    <rect x="227" y="144" width="170" height="96" rx="8" fill="#cfe2f3" stroke="#0b5394"/>
    <text x="312" y="184" text-anchor="middle">Data aman,</text><text x="312" y="202" text-anchor="middle">platform tangguh</text>
    <rect x="414" y="144" width="170" height="96" rx="8" fill="#d9ead3" stroke="#38761d"/>
    <text x="499" y="184" text-anchor="middle">Pertukaran data</text><text x="499" y="202" text-anchor="middle">satu pintu</text>
    <rect x="601" y="144" width="170" height="96" rx="8" fill="#d9ead3" stroke="#38761d"/>
    <text x="686" y="184" text-anchor="middle">Data inti satu</text><text x="686" y="202" text-anchor="middle">versi, tepercaya</text>
    <rect x="788" y="144" width="172" height="96" rx="8" fill="#fff2cc" stroke="#b45f06"/>
    <text x="874" y="184" text-anchor="middle">Data dipakai luas</text><text x="874" y="202" text-anchor="middle">untuk keputusan</text>
  </g>
  <g id="panah" stroke="#666" stroke-width="2" fill="none">
    <path d="M218 250 L218 300"/><path d="M592 250 L592 300"/><path d="M874 250 L874 300"/>
  </g>
  <g id="tema" font-size="15">
    <text x="40" y="294" font-size="15" font-weight="bold" fill="#333">Tema peta jalan</text>
    <rect x="40" y="306" width="357" height="80" rx="8" fill="#0b5394"/>
    <text x="218" y="340" text-anchor="middle" fill="#fff" font-weight="bold">Tahun 1</text><text x="218" y="362" text-anchor="middle" fill="#fff">Fondasi dan Kendali</text>
    <rect x="414" y="306" width="357" height="80" rx="8" fill="#38761d"/>
    <text x="592" y="340" text-anchor="middle" fill="#fff" font-weight="bold">Tahun 2</text><text x="592" y="362" text-anchor="middle" fill="#fff">Integrasi dan Pertukaran Terstandar</text>
    <rect x="788" y="306" width="172" height="80" rx="8" fill="#b45f06"/>
    <text x="874" y="340" text-anchor="middle" fill="#fff" font-weight="bold">Tahun 3</text><text x="874" y="362" text-anchor="middle" fill="#fff">Pemanfaatan dan Skala</text>
  </g>
  <text x="40" y="420" font-size="13" fill="#555">Setiap tahun membangun di atas hasil tahun sebelumnya; tujuan di kiri menjadi prasyarat tujuan di kanan.</text>
  </g>
</svg>
